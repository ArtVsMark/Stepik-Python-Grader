name: Agent PR opener

# issue #1302: последний шаг конвейера, где был нужен человек. Проверки идут
# сами, `merge-queue.yml` двигает голову очереди, GitHub мержит по зелёному —
# а PR открывал владелец руками, и зелёная ветка стояла до нажатия кнопки.
#
# ПОЧЕМУ ЭТО НЕ ДЕЛАЕТ САМА СЕССИЯ. Прокси облачной сессии подменяет учётные
# данные на записи: `POST /pulls` проходит, но автором становится `claude[bot]`,
# а такой PR гейт `check_pr_ready.py` не мержит намеренно — squash атрибутирует
# коммит автору pull request, и бот навсегда остался бы автором в `main`.
# Здесь же PR создаётся PAT владельца, и автор — человек.
#
# ПОЧЕМУ ДВА ТРИГГЕРА. `push` в `agent/**` — быстрый путь, но пуш из облачной
# сессии идёт учётными данными приложения, и полагаться на то, что он всегда
# разбудит workflow, нельзя. Расписание закрывает эту дыру: пропущенная ветка
# подхватится следующим запуском, а идемпотентность скрипта не даёт открыть
# второй PR на ту же ветку.
on:
  push:
    branches: ["agent/**"]
  schedule:
    # Не в 0 и не в 30: минута выбрана так, чтобы не совпадать с пиком, когда
    # GitHub обслуживает все расписания планеты разом.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  open-pulls:
    # issue #1271: без этого действует умолчание GitHub в 6 часов.
    timeout-minutes: 10
    runs-on: ubuntu-latest

    # Секрет кладётся в env, а не проверяется в `if` напрямую: контекст
    # `secrets` в условиях шага не гарантирован, а `env` — документированный
    # приём именно для этой проверки. Тот же приём, что в `merge-queue.yml`.
    env:
      MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Секрета нет — предупреждаем и выходим, а не падаем: workflow висит и на
      # расписании, и красный здесь означал бы вечно красную историю прогонов
      # из-за ненастроенного удобства.
      - name: Секрет для открытия PR не задан
        if: env.MERGE_QUEUE_TOKEN == ''
        run: |
          echo "::warning::MERGE_QUEUE_TOKEN не задан — PR для веток agent/**" \
               "не открываются. Нужен токен с правами contents:write и" \
               "pull-requests:write; GITHUB_TOKEN не подходит — с ним автором" \
               "PR станет бот, и мерж-гейт такой PR не пропустит"

      - name: Открыть PR для веток agent/**
        if: env.MERGE_QUEUE_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.MERGE_QUEUE_TOKEN }}
        run: python scripts/open_agent_prs.py
