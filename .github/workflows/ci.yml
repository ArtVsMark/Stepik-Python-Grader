name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # issue #173 / эпик #167: README-витрина не должна разрастаться, а локальные
  # Markdown-ссылки README ↔ docs не должны протухать. Проверка на чистом stdlib
  # (без pip install) — быстрая и детерминированная, поэтому отдельным job.
  docs-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: README line-budget + Markdown link-check
        run: python scripts/check_docs_guardrails.py
      # issue #264: message_id-каталог веб-API (web/i18n.py) — ru.json должен
      # покрывать все message_id, используемые в web/*.py, а ru.json/en.json
      # обязаны иметь одинаковый набор ключей. Тоже чистый stdlib (ast/json),
      # без pip install — держим в том же быстром job, что и docs-guardrails.
      - name: Locale message catalog guardrails (issue #264)
        run: python scripts/check_locale_guardrails.py

  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    # issue: coverage- и version-бейджи README читают .github/badges/*.json —
    # только один job матрицы (ubuntu-latest/3.12, push в main) коммитит их обратно.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
        experimental: [false]
        include:
          - os: ubuntu-latest
            python-version: "3.14"
            experimental: true

    steps:
      - uses: actions/checkout@v5
        # issue #162: динамическая версия (setuptools-scm) вычисляется из git-тегов.
        # fetch-depth: 0 подтягивает полную историю + теги, иначе pip install -e .
        # не сможет определить версию, а check_version_consistency.py — baseline.
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # issue #420: bubblewrap НЕ ставится в CI намеренно. GitHub Actions runners
      # запрещают bwrap поднять loopback в сетевом namespace (--unshare-net даёт
      # `RTM_NEWADDR: Operation not permitted`), поэтому НИ ОДИН sandbox-прогон на
      # раннере не стартует — тесты падали бы, а не давали покрытие. Linux
      # SandboxRunner проверяется локально (`apt-get install bubblewrap` +
      # `pytest tests/test_sandbox_runner.py`); в CI тесты корректно скипаются
      # (skipif bwrap отсутствует). Backend-фикс usrmerge (#420) — в _linux.py.

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check
        run: mypy src/stepik_grader --ignore-missing-imports

      - name: Version consistency (issue #165)
        run: python scripts/check_version_consistency.py

      # issue #294: this job's OWN --cov-fail-under=85 gate (pyproject.toml)
      # otherwise counts the OTHER two platforms' core/sandbox/ backend files
      # as permanently-uncovered (they're structurally unreachable here --
      # SandboxRunner.__init__ never imports them on this OS) -- measured as
      # little as ~1.1pp margin on ubuntu. Generates a CI-only coverage config
      # that additionally omits those unreachable files for THIS job's gate;
      # the coverage-combine job below does NOT use it, so the true cross-OS
      # aggregate (--fail-under=90) still sees every file counted by whichever
      # job(s) can actually exercise it -- no file is omitted everywhere.
      - name: Generate per-OS coverage config (issue #294)
        shell: bash
        run: python scripts/generate_ci_coveragerc.py "$(python -c 'import platform; print(platform.system())')"

      - name: Run tests
        run: pytest -q --cov-config=.coveragerc.ci

      # issue #283: each OS job only ever exercises its OWN core/sandbox/
      # backend (_linux.py/_macos.py/_windows.py) — the other two always read
      # 0% on this machine, which permanently caps any single job's coverage
      # well below what the test suite actually exercises across the matrix.
      # Rename + upload this job's .coverage data file so the coverage-combine
      # job (below) can merge all three OSes into one honest cross-platform
      # number. One Python version per OS is enough — the sandbox backends
      # aren't Python-version-dependent, no need to duplicate across 3.13.
      - name: Rename coverage data file for combine (issue #283)
        if: matrix.python-version == '3.12' && matrix.experimental == false
        shell: bash
        run: mv .coverage ".coverage.${{ matrix.os }}"

      - name: Upload coverage data (issue #283)
        if: matrix.python-version == '3.12' && matrix.experimental == false
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.os }}
          path: .coverage.${{ matrix.os }}
          # v4 excludes dotfiles by default; .coverage.* needs this explicitly.
          include-hidden-files: true

      # Single-OS badges (this job's own ubuntu/3.12 view) + the version
      # badge (coverage-independent) — unchanged from before issue #283.
      # The cross-OS combined badge is a SEPARATE job below (coverage-combine)
      # so the two commits are naturally sequenced (combine `needs: test`,
      # so it can't start until this step's commit has already landed) rather
      # than racing each other; they can still race a *different* concurrent
      # push's badge commit, same as before — same retry loop handles that.
      - name: Update badges (main only)
        if: |
          github.event_name == 'push' &&
          matrix.os == 'ubuntu-latest' &&
          matrix.python-version == '3.12' &&
          matrix.experimental == false
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            python scripts/generate_coverage_badge.py --label "coverage (ubuntu)"
            python scripts/generate_version_badge.py
            git add .github/badges/
            # --cached, not plain `git diff`: a brand-new badge file (e.g.
            # coverage-combined.json on its first-ever run) is untracked, and
            # plain `git diff --quiet` only looks at tracked files -- it would
            # silently report "unchanged" and never commit the new file
            # (issue #286). Staging first makes the check see additions too.
            if git diff --cached --quiet; then
              echo "Badges unchanged."
              break
            fi
            git commit -m "chore(ci): update badges [skip ci]"
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Badges pushed (attempt $attempt)."
              break
            fi
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/main
            if [ "$attempt" = 3 ]; then
              echo "::warning::Badge update push raced with a concurrent update and failed after 3 attempts — a later push will catch it up."
            else
              echo "Attempt $attempt: badge push raced with a concurrent update — retrying."
              sleep $((attempt * 5))
            fi
          done

  # issue #283: merges the three OS jobs' coverage data into one report that
  # reflects what's actually exercised across the whole matrix (each
  # core/sandbox/ backend covered by its native OS), instead of any single
  # job's structurally-partial view. Also owns the README badge commit (moved
  # here from the `test` job, issue #283) — one place doing badge commits
  # avoids two jobs racing to push .github/badges/*.json independently.
  coverage-combine:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        # issue #162: version badge needs full history + tags (same reasoning
        # as the old badge step this job replaces).
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install coverage
        run: pip install coverage

      - name: Download coverage data from all OS jobs
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          path: coverage-artifacts
          merge-multiple: true

      - name: Combine and report (issue #283)
        run: |
          coverage combine coverage-artifacts
          coverage report -m
          coverage report --fail-under=90
          coverage xml

      # Same retry logic as the test job's badge step — two pushes to main
      # close together race on this commit; on conflict, abort the rebase,
      # reset to fresh origin/main, and regenerate (usually resolves to
      # "Badges unchanged" once rebased onto the winner's commit). A final
      # failure after 3 attempts is a warning, not a job failure — a later
      # push will catch the badges up regardless. Only the combined coverage
      # badge here — the version badge is coverage-independent and already
      # handled by the `test` job's own badge step.
      - name: Update combined coverage badge (main only)
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            python scripts/generate_coverage_badge.py --out .github/badges/coverage-combined.json --label "coverage (all OS)"
            git add .github/badges/
            # --cached, not plain `git diff`: coverage-combined.json is a
            # brand-new file the first time this job ever runs -- untracked,
            # so plain `git diff --quiet` (tracked files only) silently sees
            # no change and never commits it (issue #286, the actual bug that
            # left this badge missing/404 on README since #283/#284 merged).
            # Staging first makes the check see additions too.
            if git diff --cached --quiet; then
              echo "Badges unchanged."
              break
            fi
            git commit -m "chore(ci): update badges [skip ci]"
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Badges pushed (attempt $attempt)."
              break
            fi
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/main
            if [ "$attempt" = 3 ]; then
              echo "::warning::Badge update push raced with a concurrent update and failed after 3 attempts — a later push will catch it up."
            else
              echo "Attempt $attempt: badge push raced with a concurrent update — retrying."
              sleep $((attempt * 5))
            fi
          done

  # issue #263: Playwright e2e smoke tests for the web UI (--serve) -- 4 user
  # journeys (mode 2 folder grading, mode 1 file picker + editable window,
  # glossary search, command palette) plus an XSS regression test for app.js's
  # esc() escaping. Deliberately a SEPARATE job, not folded into the `test`
  # matrix above: Linux-only (one browser/OS combo is enough for a DOM-level
  # smoke suite), and tests/e2e/ needs the opt-in "e2e" extra + a downloaded
  # Chromium binary that the main matrix jobs must not pay for. Playwright
  # itself is a dev-only extra (see pyproject.toml's `e2e` group) -- it is
  # NOT a new runtime dependency.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # issue #162: setuptools-scm needs full history + tags to resolve
        # the package version during `pip install -e .` (same reasoning as
        # the `test` job above).
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies (dev + e2e extras)
        run: pip install -e ".[dev,e2e]"

      # Cache Chromium's downloaded binary (~100+ MB) across runs, keyed on
      # OS + pyproject.toml's content hash so a playwright version bump
      # invalidates the cache automatically.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install Playwright Chromium + OS deps (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      # Cache hit: the browser binary is already there, but the runner image
      # itself is ephemeral -- Chromium's shared-library OS deps still need
      # (re-)installing every run.
      - name: Install Playwright OS deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run e2e tests
        run: pytest tests/e2e/ -v --no-cov
