name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # PyPI publishing via OIDC trusted publishing — no stored token/secret
  # (issue #70). ONE-TIME MANUAL SETUP required by a repo owner with PyPI
  # access before this works:
  #   pypi.org -> the "stepik-python-grader" project -> Manage -> Publishing
  #   -> Add a pending/trusted publisher with:
  #        Owner:        ArtVsMark
  #        Repository:   Stepik-Python-Grader
  #        Workflow:     release.yml
  #        Environment:  pypi
  # Recommended: dry-run against test.pypi.org first (see the commented step).
  # This job is independent of the GitHub Release job above (`needs: release`
  # only orders it after a successful build): if the trusted publisher is not
  # configured yet, only THIS job fails — the GitHub Release still publishes.
  pypi-publish:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # mint the OIDC token PyPI trusted publishing verifies

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      # Dry-run on TestPyPI first — uncomment, publish once, verify
      # `pipx install -i https://test.pypi.org/simple/ stepik-python-grader`,
      # then re-comment and enable the real PyPI step below.
      # - name: Publish to TestPyPI
      #   uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
