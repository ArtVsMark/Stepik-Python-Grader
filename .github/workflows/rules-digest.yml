name: Rules digest rebuild

# Дайджест и указатель правил — ПРОИЗВОДНОЕ от чужого каталога. Пополнился он —
# оба файла отстали, и до сих пор пересобирало их окно: ночной обход находил
# отставание, человек открывал PR. За одну смену это делалось трижды, причём в
# третий раз человек про пересборку забыл и поймал его тест.
#
# ПОЧЕМУ НЕ ВЫНОСИМ ФАЙЛЫ ИЗ main. Правило 160 меряет ЧАСТОТУ: вне общей ветки
# живёт производное, которое пересобирается чаще, чем идут изменения. Здесь
# наоборот — каталог пополняется реже, чем мы принимаем PR, и по критерию
# правила место дайджеста в `main`. Менять надо не хранение, а того, кто
# пересобирает.
#
# ЧТО ДЕЛАЕТ. Клонирует каталог, зовёт генераторы и, если файлы изменились,
# пушит ветку `agent/rules-digest`. Дальше работает существующий конвейер:
# `agent-pr.yml` откроет PR от имени владельца, метка `merge-when-green`
# доведёт до мержа, обязательные проверки не пропустят поломанную пересборку.
#
# ПОЧЕМУ ОТДЕЛЬНЫЙ ПРОГОН, А НЕ ШАГ В `tracker-guardrails.yml`. Разные права и
# разные предметы. Обходу нужен `issues: write` и не нужен пуш; здесь наоборот —
# пуш рабочего дерева токеном владельца и никакой записи в трекер. Смешав их,
# мы дали бы обходу право писать в репозиторий, которое ему не нужно.
#
# ЧЕГО ЗДЕСЬ НЕТ И НЕ БУДЕТ — ОТВЕТОВ ПО НОВЫМ ПРАВИЛАМ. Пересборка механична,
# ответ каталогу — суждение: чем правило держится здесь, знает проект, а не
# генератор. Новые правила остаются находкой ночного обхода и работой окна.
#
# ОТКРЫВАТЕЛЬ У ВЕТКИ ОДИН, И ЭТО НЕ ЭТОТ ПРОГОН. `gh pr create` отсюда был бы
# второй дорогой к тому же PR и работал бы на удаче — кто успеет раньше,
# `agent-pr.yml` или мы. У соседа такая гонка уже стоила красного прогона на
# «No commits between main and chore/metrics».

on:
  schedule:
    # Позже ночного обхода: тот только НАХОДИТ отставание, а чинить его этому
    # прогону. Минута не круглая — расписания планеты GitHub обслуживает разом.
    - cron: "47 6 * * *"
  # У событийной автоматики есть ручная кнопка (правило 104).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Ветка одна и пушится с --force: две гонки за неё дали бы два разных
  # состояния подряд и лишний прогон на каждое.
  group: rules-digest
  cancel-in-progress: true

jobs:
  rebuild:
    # issue #1271: без этого действует умолчание GitHub в 6 часов.
    timeout-minutes: 15
    runs-on: ubuntu-latest

    # Секрет кладётся в env, а не проверяется в `if` напрямую: контекст
    # `secrets` в условиях шага не гарантирован. Тот же приём, что в agent-pr.
    env:
      MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
      BRANCH: agent/rules-digest

    steps:
      - name: Токен владельца задан
        if: env.MERGE_QUEUE_TOKEN == ''
        run: |
          echo "::error::MERGE_QUEUE_TOKEN не задан — пересобранный дайджест некому довезти" \
               "до main. Нужен PAT владельца с contents:write. GITHUB_TOKEN не подходит:" \
               "его пуш не будит проверки, и PR остался бы без них."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Тем же токеном пойдёт push ветки: пуш штатным токеном не разбудил
          # бы ни agent-pr, ни проверки на открытом PR.
          token: ${{ env.MERGE_QUEUE_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Клон свежий, а не по закреплённому SHA: предмет пересборки — ИМЕННО
      # то, что каталог изменился. Пин здесь означал бы «догонять вчерашнее».
      - name: Клонировать каталог правил
        timeout-minutes: 5
        run: git clone --depth 1 https://github.com/ArtVsMark/Engineering-Incidents-Playbook /tmp/playbook

      # Решение — в скрипте, а не здесь: шаги workflow не тестируются, а
      # scripts/rebuild_rules_digest.py покрыт набором на все три исхода.
      - name: Пересобрать и решить, можно ли везти
        id: rebuild
        run: |
          verdict=$(python scripts/rebuild_rules_digest.py --catalogue /tmp/playbook)
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "вердикт пересборки: $verdict"

      - name: Нечего везти
        if: steps.rebuild.outputs.verdict == 'nothing'
        run: echo "дайджест и указатель совпадают с каталогом"

      # Не ошибка, а граница механизма: ответ каталогу — суждение проекта.
      - name: Отправка невозможна — нет ответов по новым правилам
        if: steps.rebuild.outputs.verdict == 'blocked'
        run: |
          echo "::notice::Дайджест пересобран, но везти его нельзя: по части правил каталога" \
               "ещё нет ответа в .rules/bindings.json, и обязательная проверка покраснела бы." \
               "Ответ — суждение проекта, а не работа генератора; находку ведёт ночной обход."

      - name: Довезти пересобранное до main
        if: steps.rebuild.outputs.verdict == 'ready'
        run: |
          # Автор — владелец: squash атрибутирует итоговый коммит автору PR, а
          # его откроет `agent-pr.yml` от имени человека. Прогон при этом не
          # исчезает из истории — он назван соавтором.
          git config user.name "Artem Markitanov"
          git config user.email "86671904+ArtVsMark@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add docs/agent/rules/
          git commit -m "chore(rules): пересобрать дайджест и указатель по каталогу" \
            -m "Оба файла — производное: их собирают scripts/generate_rules_digest.py и scripts/generate_rules_index.py из клона каталога правил. Изменение открыто — значит каталог разошёлся с тем, что читает окно на старте." \
            -m "Собрал прогон Rules digest rebuild; PR откроет agent-pr.yml по этому пушу. Ответы по новым правилам сюда не входят: чем правило держится здесь, знает проект, а не генератор." \
            -m "Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

          # --force: ветка одна и переиспользуется. Прошлое её состояние уже
          # уехало в main своим PR либо устарело вместе с каталогом.
          git push --force origin "$BRANCH"
