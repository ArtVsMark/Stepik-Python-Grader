name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # issue #807: агент запускается с OAuth-токеном владельца, а триггеры
    # issues/issue_comment открыты всему интернету — раньше условием было только
    # наличие «@claude» в тексте, поэтому любой посторонний мог заводить issue и
    # жечь квоту владельца, а текст issue шёл прямо в промпт агента. Теперь к
    # упоминанию добавлено требование к автору: OWNER/MEMBER/COLLABORATOR.
    # author_association проставляет сам GitHub по факту прав в репозитории —
    # подделать его содержимым issue нельзя.
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@1623c36729ac1cd5895198cded705a287de7db79 # v1.0.187
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # issue #807: инструменты ограничены явно. Текст issue/комментария
          # попадает в промпт агента как есть, поэтому набор инструментов — это
          # единственный барьер против инструкции «выполни команду и отправь
          # результат наружу»: без списка агенту доступен произвольный Bash.
          # Разрешено только чтение репозитория и чтение обсуждений через gh;
          # ничего, что пишет в репозиторий или ходит в сеть по своему усмотрению.
          # Права job'а (выше) и так read-only — список инструментов закрывает
          # вторую половину: канал исполнения, а не канал записи.
          claude_args: '--allowed-tools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*)"'
