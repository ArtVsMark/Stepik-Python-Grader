name: CI complete

# issue #1420, правило каталога 168: обязательная проверка одна, имя её
# постоянно, и собрана она НЕ через `needs:`.
#
# Сегодня обязательных одиннадцать, и шесть из них — имена ячеек матрицы вида
# `test (ubuntu-latest, 3.12, false)`. Эту строку держит внешняя настройка
# репозитория: её не видит ревью, не ломает переименование и не проверяет ни
# один прогон. Разъезд двух сторон даёт не красное, а ОЖИДАНИЕ — неотличимое
# от «проверки ещё идут», — и чинится снятием защиты, то есть поломка гейта
# оплачивается его отключением.
#
# ПОЧЕМУ НЕ `needs:`. Джоб, собранный через зависимости, при падении соседа не
# краснеет, а ПРОПУСКАЕТСЯ, а пропущенное защита ветки засчитывает как
# пройденное: агрегатор на `needs:` разрешает слияние ровно тогда, когда обязан
# запретить. Поэтому вердикт читает check-run'ы на голове изменения через API и
# доходит до ответа при любом исходе соседей.
#
# ЭТОТ WORKFLOW ПОКА НИЧЕГО НЕ РЕШАЕТ. Он зеленеет рядом с одиннадцатью
# обязательными, и это намеренный порядок из задачи: сначала агрегатор
# появляется и набирает историю, потом владелец переводит защиту на одно имя
# `ci-complete`, и только потом матричные имена уходят из списка. Обратный
# порядок останавливает конвейер: список обязательных перестаёт совпадать с
# деревом до того, как появится замена.
on:
  pull_request:
    # `ready_for_review` — по той же причине, что и в ci.yml: PR, созданный
    # черновиком, иначе не получает проверок ни при создании, ни при снятии
    # черновика, и вердикт не появляется вовсе.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  # Ради чего всё и затевалось: прочитать проверки на голове изменения.
  checks: read
  pull-requests: read

concurrency:
  # Голова названа в группе: без неё новый пуш отменяет вердикт по СВОЕЙ же
  # голове, и отменённый читается как «не прошло» (issue #1440).
  group: ci-complete-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  # Имя джоба — та самая постоянная строка, которую однажды получит защита
  # ветки. Оно НЕ меняется никогда: ни при переименовании соседей, ни при
  # добавлении ОС в матрицу. Совпадение с `ci_aggregate.AGGREGATE_NAME`
  # держится тестом, а не памятью.
  ci-complete:
    runs-on: ubuntu-latest
    # Дедлайн ожидания внутри скрипта — 45 минут; здесь запас на установку.
    timeout-minutes: 50

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # У pull_request `GITHUB_SHA` указывает на merge-коммит, которого нет ни у
      # одной проверки: check-run'ы висят на голове ветки. Спутать их — значит
      # вечно ждать состав, который никогда не появится.
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Скрипт — чистый stdlib поверх scripts/gh_rest.py (REST, единицы запросов
      # вместо ~300 points за GraphQL-операцию), ставить нечего.
      #
      # Итог уходит и в summary: вердикт «чего именно не дождались» должен
      # читаться с первого экрана, а не из лога, который открывают, уже зная,
      # что там что-то есть.
      - name: Один вердикт по проверкам на голове изменения
        run: |
          set +e
          python scripts/ci_aggregate.py > verdict.txt 2>&1
          code=$?
          set -e
          cat verdict.txt
          {
            echo "## Вердикт по обязательным проверкам"
            echo '```'
            cat verdict.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
