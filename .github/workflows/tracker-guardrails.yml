name: Tracker guardrails

# issue #1348: две проверки состояния трекера были написаны, покрыты тестами —
# и не запускались НИЧЕМ: ни `ci.yml`, ни `preflight.py`, ни pre-commit, ни
# расписанием. Свод при этом обещал, что они «проверяют», то есть правило
# исполнялось ровно тогда, когда кто-то вспомнит команду. За месяц не вспомнил
# никто.
#
# ПОЧЕМУ НЕ В `ci.yml`. Обе ходят в GitHub API, а квота общая на аккаунт и
# расходуется прогонами всех PR разом. Предмет у них — состояние ТРЕКЕРА, а не
# кода: от коммита к коммиту оно не меняется, поэтому проверять его на каждый
# push бессмысленно вдвойне — и дорого, и не о том.
#
# ПОЧЕМУ ПРЕДУПРЕЖДЕНИЕ, А НЕ ОТКАЗ. Обе проверки судят о вероятном: чек-лист
# мог отсутствовать намеренно, `good first issue` мог быть только что заведён и
# ещё ждать перевода. Красный прогон здесь означал бы «почини трекер», а чинить
# может быть нечего — поэтому итог уходит в summary прогона, а не в код
# возврата.
on:
  schedule:
    # Раз в сутки. Минута не круглая: в 0 и 30 GitHub обслуживает расписания
    # всей планеты, и запуск сдвигается непредсказуемо.
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Проверки трекер только читают; обратная ссылка правила — единственный шаг,
  # который в него ПИШЕТ (метка и один идемпотентный комментарий на задачу).
  issues: write
  pull-requests: read

concurrency:
  group: tracker-guardrails
  cancel-in-progress: false

jobs:
  tracker-state:
    runs-on: ubuntu-latest
    # issue #1271: без этого действует умолчание GitHub в 6 часов — зависший
    # шаг держал бы исполнителя, которым пользуются прогоны PR.
    timeout-minutes: 10

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Обе проверки — чистый stdlib поверх `scripts/gh_rest.py` (REST, 1 запрос
      # из 5000 вместо ~300 points за GraphQL-операцию), ставить нечего.
      #
      # `|| true` и запись в summary вместо `continue-on-error`: последний
      # красит шаг в жёлтое и прячет причину под кат, а нам нужно, чтобы итог
      # читался с первого экрана прогона — иначе предупреждение снова окажется
      # тем, о чём никто не вспомнит.
      - name: Комплексные issue ведут чек-лист находок
        run: |
          {
            echo "## Чек-листы комплексных issue"
            echo '```'
            python scripts/check_issue_checklists.py 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: good first issue и help wanted — на двух языках
        run: |
          {
            echo "## Двуязычие меток онрампа"
            echo '```'
            python scripts/check_good_first_issues_bilingual.py 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # issue #1296: предмет — настройки репозитория, а не трекер, но частота та
      # же и обращение то же (REST, 2 запроса). Отличие от соседей по файлу одно
      # и намеренное: этот шаг ПАДАЕТ. У них «починить может быть нечего» —
      # перевода не написали, чек-лист не завели; здесь же расхождение означает,
      # что публично заявленная гарантия перестала существовать, а чинить всегда
      # есть что. Код 2 — «прочитать нечем» (нет PAT с administration: read) —
      # остаётся предупреждением: «не знаем» и «плохо» ведут к разным действиям.
      - name: Защита main не ослаблена молча
        env:
          GITHUB_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set +e
          output=$(python scripts/check_branch_protection.py 2>&1)
          code=$?
          {
            echo "## Защита main"
            echo '```'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 2 ]; then
            echo "::warning::ruleset прочитать нечем — нужен PAT с правом administration: read"
            exit 0
          fi
          exit "$code"

      # У документа аудита собственное правило состояния — «находка открыта, пока
      # её ID не значится в реестре PR», — и оно жило без механизма. Замер 26.08:
      # 57 записей реестра против 209 фактически закрытых находок, то есть 152
      # закрытых числились открытыми. Предупреждение, а не отказ: разбор
      # эвристический, а только что смерженный PR законно ещё не дописан.
      - name: Реестр закрытых находок не отстаёт от main
        run: |
          {
            echo "## Реестр находок аудита"
            echo '```'
            python scripts/check_audit_registry.py 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # issue #1351: полнота ответа каталогу правил и метрика нерассмотренных.
      # Каталог публичный, клонируется мелко и без токена — контракт прямо это
      # и предполагает: подключиться может кто угодно.
      - name: Клонировать каталог правил
        run: git clone --depth 1 https://github.com/ArtVsMark/claude-code-playbook /tmp/playbook

      # issue #1351: связь «задача → правило» была односторонней — у правила след
      # ведёт на задачу, у задачи о правиле ни слова, и следующий разбор того же
      # места начинается с нуля. Комментарий ОДИН на задачу и обновляется по
      # месту: идемпотентность держится скрытым маркером в теле, а не совпадением
      # текста (текст растёт вместе с числом правил).
      #
      # Единственный шаг файла, которому нужна запись в трекер. Клон каталога
      # сделан шагом выше.
      - name: Задача знает, что породила правило
        run: |
          {
            echo "## Обратная ссылка в задачу-источник"
            echo '```'
            python scripts/link_rules_to_issues.py --catalogue /tmp/playbook --apply 2>&1 || true

      # issue #1351: зазор между появлением правила и решением по нему не был
      # виден нигде — `.rules/bindings.json` честно пишет `unreviewed`, но по
      # расписанию файл никто не открывает. Issue ОДИН и постоянный: находится по
      # скрытому маркеру в теле, а не по номеру (номер пришлось бы хранить, а
      # хранимое состояние протухает) и не по заголовку (он меняется с числом).
      - name: Входящие каталога правил
        run: |
          {
            echo "## Входящие каталога правил"
            echo '```'
            python scripts/rules_inbox.py --catalogue /tmp/playbook --apply 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ответ каталогу правил полон, метрика нерассмотренных
        run: |
          {
            echo "## Ответ каталогу правил"
            echo '```'
            python scripts/check_rule_bindings.py --catalogue /tmp/playbook 2>&1 || true
            echo '```'
            echo "Метрика «не обеспечено ничем» обязана уменьшаться."
          } >> "$GITHUB_STEP_SUMMARY"
