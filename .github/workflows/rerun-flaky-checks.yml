name: Rerun flaky checks

# issue #1362: частичный перезапуск у нас есть (#1344), и он умеет ровно то,
# что нужно, — но позвать его может лишь тот, у кого есть `actions:write`.
# У облачной сессии его нет: прокси закрывает запись, GitHub отвечает
# «403 Resource not accessible by integration». Дежурное окно видит мигнувшую
# проверку, умеет её перезапустить и не может этого сделать; оставался клик
# человека, то есть ровно та ручная работа, которую конвейер должен убирать.
#
# У workflow права есть. Тот же приём уже применён в `merge-queue.yml`, где не
# хватало штатного токена, — только там нужен был PAT ради запуска чужих
# прогонов, а здесь достаточно `permissions: actions: write`.
#
# ЧТО ЭТОТ WORKFLOW НЕ ДЕЛАЕТ. Он не «чинит красноту»: список проверок,
# разрешённых к автоматическому перезапуску, закрыт (`AUTO_RERUN` в скрипте) и
# содержит только те, чей красный цвет заведомо не означает дефект в коде.
# Обязательные проверки — `test`, `static`, `docs-guardrails` и остальные —
# он не трогает никогда, и красный PR с ними так и останется красным, пока его
# не починят.
on:
  schedule:
    # Дважды в час. Минуты не круглые: в 0 и 30 GitHub обслуживает расписания
    # всей планеты, и запуск сдвигается непредсказуемо.
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Ради чего всё и затевалось: перезапуск упавших джобов — это запись.
  actions: write
  # Список открытых PR и их проверки — чтение.
  pull-requests: read

concurrency:
  group: rerun-flaky-checks
  cancel-in-progress: false

jobs:
  rerun:
    runs-on: ubuntu-latest
    # issue #1271: без этого действует умолчание GitHub в 6 часов — зависший
    # шаг держал бы исполнителя, которым пользуются прогоны PR.
    timeout-minutes: 10

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Скрипт — чистый stdlib поверх `scripts/gh_rest.py` (REST, единицы
      # запросов вместо ~300 points за GraphQL-операцию), ставить нечего.
      #
      # Итог уходит в summary прогона, а не только в лог: решение механизма —
      # «перезапустил вот это, а вот это не тронул и почему» — должно читаться
      # с первого экрана. Спрятанное в лог объяснение равносильно его
      # отсутствию: следующий разбор начнётся с вопроса, почему PR стоял.
      - name: Мигнувшую проверку перезапускает механизм
        run: |
          {
            echo "## Перезапуск мигнувших проверок"
            echo '```'
            python scripts/rerun_flaky_checks.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
