[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stepik-python-grader"
version = "1.1.0"
description = "Automatic comparison and testing of Python solutions from Stepik courses"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
    "psutil>=5.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.15.19",
]

[project.scripts]
stepik-grader = "stepik_grader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S102"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["stepik_grader"]

[tool.ruff.lint.per-file-ignores]
# grader.py is a pure backward-compat re-export facade over core/grader_core.py /
# core/reporter.py / cli.py -- every import in it is intentionally "unused" here.
"src/stepik_grader/grader.py" = ["F401", "F403", "F405", "I001"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-report=xml -v --tb=short"
testpaths = ["tests"]
python_classes = ["Test*"]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/stepik_grader/diagnostic_stepik.py",
    "tests/*",
    "conftest.py",
]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
]

[tool.stepik-grader]
timeout_seconds = 10.0
executor_timeout = 10
similar_threshold = 1.15
much_slower_threshold = 1.50
measure_child_memory = true
microbench_max_cases = 5
encoding = "utf-8"
max_memory_mb = 1024
