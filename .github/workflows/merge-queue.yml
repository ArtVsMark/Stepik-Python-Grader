name: Merge queue mover

# issue #1287: очередь мержа умеет вычисляться (#1282), но двигать её было
# некому. Между «защита требует актуальной ветки» и «кто-то её обеспечивает»
# зазор: кнопка Update branch — ручное действие, `auto-merge` ветку НЕ
# обновляет (он лишь ждёт зелёного и актуальности), а merge queue личному
# аккаунту недоступна (#1235). Этот workflow и есть недостающий исполнитель.
#
# ПОЧЕМУ НЕ `push` В `main`, как предлагалось в issue. Условия оттуда же:
# «не обновлять, пока на main идёт прогон или последний прогон красный».
# На `push` прогон `main` только что стартовал — то есть занят ВСЕГДА, и
# обновление не выполнялось бы никогда. `workflow_run` по завершении CI
# отвечает на оба условия сам: прогон закончился, и его исход известен.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  # Метка `needs-rebase` на конфликтном PR (issue #1313) — это запись.
  pull-requests: write

jobs:
  move-the-head:
    # Красный `main` в ветку не затаскиваем: сначала чинить базу, потом двигать
    # очередь. Ровно то условие, что стоит в `check_pr_ready.py`.
    if: github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    # issue #1271: без этого действует умолчание GitHub в 6 часов —
    # зависший шаг держит не только свой job, но и всю очередь мержа.
    timeout-minutes: 15

    # Секрет кладётся в env, а не проверяется в `if` напрямую: контекст
    # `secrets` в условиях шага не гарантирован, а `env` — документированный
    # приём именно для этой проверки.
    env:
      MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Секрета нет — предупреждаем и выходим, а не падаем: workflow висит на
      # `main`, и красный здесь означал бы красную базу из-за ненастроенного
      # удобства.
      #
      # ЛОВУШКА, ради которой нужен отдельный токен. Пуш, сделанный штатным
      # `GITHUB_TOKEN`, не запускает другие workflow — защита GitHub от
      # рекурсии. Ветка обновилась бы, событие `synchronize` пришло, а CI на PR
      # не стартовал: PR застрял бы иначе, но так же намертво.
      - name: Секрет для обновления не задан
        if: env.MERGE_QUEUE_TOKEN == ''
        run: |
          echo "::warning::MERGE_QUEUE_TOKEN не задан — очередь не двигается." \
               "Нужен токен с правами contents:write и pull-requests:write;" \
               "GITHUB_TOKEN не подходит — его пуш не запускает прогон на PR"

      # issue #1313: решение целиком в скрипте, а не в YAML-условиях. Прежний
      # шаг звал `update-branch` на первом готовом PR и падал, если тот
      # конфликтует с `main`, — вместе со всем прогоном. Конфликт же ситуация
      # штатная, и очередь из-за него стояла по 14 часов, хотя рядом ждали
      # здоровые PR. Мувер обходит конфликтного, метит его `needs-rebase` и
      # обновляет первого пригодного; прогон остаётся зелёным, потому что
      # красный здесь означает «механизм сломан», а не «у кого-то конфликт».
      - name: Подвинуть очередь
        if: env.MERGE_QUEUE_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.MERGE_QUEUE_TOKEN }}
        run: python scripts/move_merge_queue.py
