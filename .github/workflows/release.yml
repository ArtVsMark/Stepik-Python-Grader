name: Release

on:
  push:
    tags:
      - "v*"

# issue #988 (REV-3-05): по умолчанию токен job'а получает широкие права записи.
# `verify` и `build` только читают репозиторий и исполняют тесты — при этом до
# сих пор шли с дефолтным токеном. Права поднимаются точечно там, где нужны:
# `contents: write` для публикации релиза, `id-token: write` для OIDC PyPI.
permissions:
  contents: read

jobs:
  # issue #809: гейт публикации. Триггер — любой тег `v*`, в том числе с ветки,
  # которая никогда не проходила CI: раньше `build` → `publish` шли без единой
  # проверки. Цена ошибки не откатывается — версия в PyPI неперезаписываема,
  # доступен только yank. Поэтому здесь тот же набор проверок, что и в матрице
  # ci.yml (ruff/mypy/version/pytest), плюс требование, чтобы тег стоял на
  # коммите из main. Один прогон на ubuntu/3.12: кросс-платформенную матрицу
  # коммит уже прошёл в CI до мержа, здесь гейт против «тег мимо main».
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # setuptools-scm и check_version_consistency читают историю и теги.
        with:
          fetch-depth: 0

      - name: Тег должен стоять на коммите из main
        run: |
          # Явный refspec: checkout по тегу настраивает origin под этот тег, и
          # remote-tracking ветка main сама по себе не появляется.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Тег $GITHUB_REF_NAME указывает на коммит вне main — публикация остановлена"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check
        run: mypy src/stepik_grader scripts

      - name: Version consistency (issue #165)
        run: python scripts/check_version_consistency.py

      # issue #988 (LINK-3-01/LINK-3-02): docs/dev/versioning.md обещает две
      # вещи — «без ротации CHANGELOG релиз падает» и «забытая запись под тег
      # роняет релиз». Обе были неправдой: guard документации в релизе не
      # запускался вовсе, а извлечение release notes жило в job'е публикации
      # GitHub Release — то есть PyPI, независимый от него по построению
      # (issue #559), публиковался при любом состоянии CHANGELOG. Обещанное
      # обязано быть гейтом, а гейт — стоять до ЛЮБОЙ публикации, поэтому обе
      # проверки здесь, в `verify`, от которого зависят оба публикующих job'а.
      - name: Documentation guardrails (CHANGELOG rotation budget)
        run: python scripts/check_docs_guardrails.py

      - name: Release notes for this tag exist (issue #834)
        run: python scripts/extract_release_notes.py "${GITHUB_REF_NAME}" --out /dev/null

      # issue #294: тот же per-OS coverage-конфиг, что и в матрице CI — иначе
      # sandbox-backend'ы двух других ОС считаются непокрытыми и гейт покрытия
      # падает на ровном месте.
      - name: Generate per-OS coverage config (issue #294)
        run: python scripts/generate_ci_coveragerc.py Linux

      - name: Run tests
        run: pytest -q --cov-config=.coveragerc.ci

  # issue #559: dist собирается ОДИН раз здесь и передаётся артефактом в оба
  # потребителя (GitHub Release + PyPI) через upload/download-artifact — раньше
  # release и pypi-publish собирали `python -m build` дважды (двойная сборка,
  # риск рассинхрона wheel/sdist между двумя запусками).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # issue #162: setuptools-scm берёт версию из git-тегов — нужна полная
        # история и теги, иначе сборка на теге не определит X.Y.0.
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # issue #1262: логическая версия (`1.11`, `1.10.234` — то же число, что
      # в бейдже README) считается по git-истории, которой в установленном
      # пакете нет. Значит она считается здесь, до сборки, и уезжает в колесо
      # файлом `_build_info.json`; окно лаунчера потом только читает его —
      # без git и без подпроцессов (issue #1166/#1149).
      - name: Build info for the package (issue #1262)
        run: |
          python -m pip install --upgrade "setuptools-scm>=8"
          python scripts/generate_build_info.py

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      # issue #988 (REL-3-06): раньше публиковался артефакт, который никто не
      # открывал. `twine check` читает метаданные собранных файлов и ловит то,
      # что PyPI отвергнет уже на загрузке (битый README/описание), — а версия в
      # PyPI неперезаписываема, откатить публикацию нечем. Заодно проверяем, что
      # сборка вообще что-то произвела: пустой `dist/` дальше пойти не должен.
      - name: Check built artifacts
        run: |
          python -m pip install --upgrade twine
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "::error::dist/ пуст — сборка ничего не произвела, публикация остановлена"
            exit 1
          fi
          twine check dist/*

      # issue #953 (REL-3-06): `twine check` читает метаданные, но не содержимое.
      # Сломанный glob в [tool.setuptools.package-data] он пропускает, и тесты
      # тоже: они смотрят дерево ИСХОДНИКОВ через stepik_grader.__file__, а не
      # собранный артефакт. Симптом у пользователя — `--serve` без редактора и
      # шрифтов, узнаётся из жалобы, потому что версия в PyPI неперезаписываема.
      - name: Verify wheel contents (issue #953)
        run: python scripts/check_wheel_contents.py dist/*.whl

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  github-release:
    # issue #809: публикация только после зелёного `verify` на этом же коммите.
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # issue #988 (REL-1-01): checkout идёт ПЕРВЫМ и только потом скачивается
      # артефакт. Обратный порядок — тот, что был здесь, — публиковал релиз без
      # единого файла: `actions/checkout` очищает рабочую директорию перед
      # выкладкой репозитория и уносил вместе с ней уже скачанный `dist/`.
      # Симптом наблюдался как «релиз опубликован, ассетов нет».
      #
      # issue #834: checkout нужен ради тела релиза — это рукописная секция
      # CHANGELOG, а не автосписок заголовков PR (раньше страница релиза
      # читалась как внутренний git log и цитировать было нечего).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # issue #559: артефакт из job `build` — без повторной сборки.
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # issue #988: последний рубеж перед публикацией. Пустой `dist/` здесь
      # означает, что артефакт не доехал, — и релиз без ассетов лучше не
      # выпускать вовсе, чем выпустить пустым: тег уже проставлен, а страницу
      # релиза увидят раньше, чем кто-то заметит отсутствие файлов.
      - name: Fail if dist is empty (issue #988)
        run: |
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "::error::dist/ пуст — артефакт сборки не доехал, релиз без ассетов не публикуем"
            exit 1
          fi
          ls -la dist

      - name: Extract release notes from CHANGELOG (issue #834)
        run: |
          python scripts/extract_release_notes.py "${GITHUB_REF_NAME}" --out release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          # issue #953 (REL-1-01): по умолчанию action при пустом glob просто
          # публикует релиз БЕЗ файлов и остаётся зелёным. Именно так выглядел
          # симптом «релиз опубликован, ассетов нет»: тег проставлен, страница
          # видна, а скачать нечего. Пропажа ассетов обязана падать.
          fail_on_unmatched_files: true
          body_path: release-notes.md
          # Автосписок остаётся приложением: action дописывает «Full changelog»
          # ниже body_path, поэтому полный перечень PR никуда не пропадает.
          generate_release_notes: true

  # PyPI publishing via OIDC trusted publishing — no stored token/secret
  # (issue #70). ONE-TIME MANUAL SETUP required by a repo owner with PyPI
  # access before this works:
  #   pypi.org -> the "stepik-python-grader" project -> Manage -> Publishing
  #   -> Add a pending/trusted publisher with:
  #        Owner:        ArtVsMark
  #        Repository:   Stepik-Python-Grader
  #        Workflow:     release.yml
  #        Environment:  pypi
  # Recommended: dry-run against test.pypi.org first (see the commented step).
  # This job is independent of the GitHub Release job above — both fan out from
  # `build` (issue #559), so if the trusted publisher is not configured yet,
  # only THIS job fails; the GitHub Release still publishes.
  pypi-publish:
    # issue #809: тот же гейт. Версия в PyPI неперезаписываема — это
    # единственная ошибка релиза, которую нельзя откатить.
    needs: [build, verify]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # mint the OIDC token PyPI trusted publishing verifies

    steps:
      # issue #559: тот же артефакт из job `build` — publish без повторной сборки.
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # Dry-run on TestPyPI first — uncomment, publish once, verify
      # `pipx install -i https://test.pypi.org/simple/ stepik-python-grader`,
      # then re-comment and enable the real PyPI step below.
      # - name: Publish to TestPyPI
      #   uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      #   with:
      #     repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
