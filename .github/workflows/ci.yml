name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    # issue: coverage-бейдж README читает .github/badges/coverage.json — только
    # один job матрицы (ubuntu-latest/3.12, push в main) коммитит его обратно.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
        experimental: [false]
        include:
          - os: ubuntu-latest
            python-version: "3.14"
            experimental: true

    steps:
      - uses: actions/checkout@v5
        # issue #162: динамическая версия (setuptools-scm) вычисляется из git-тегов.
        # fetch-depth: 0 подтягивает полную историю + теги, иначе pip install -e .
        # не сможет определить версию, а check_version_consistency.py — baseline.
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check
        run: mypy src/stepik_grader --ignore-missing-imports

      - name: Version consistency (issue #165)
        run: python scripts/check_version_consistency.py

      - name: Run tests
        run: pytest -q

      # Один job матрицы (ubuntu-latest/3.12, не experimental) на push в main
      # пересчитывает coverage-бейдж README из свежего coverage.xml и коммитит
      # его обратно — без этого шага README хранил бы вручную вписанный процент,
      # который расходится с реальным покрытием при каждом изменении тестов.
      - name: Update coverage badge (main only)
        if: |
          github.event_name == 'push' &&
          matrix.os == 'ubuntu-latest' &&
          matrix.python-version == '3.12' &&
          matrix.experimental == false
        run: |
          python scripts/generate_coverage_badge.py
          if git diff --quiet -- .github/badges/coverage.json; then
            echo "Coverage badge unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/badges/coverage.json
            git commit -m "chore(ci): update coverage badge [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
