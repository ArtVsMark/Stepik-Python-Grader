name: Rerun red main

# issue #1524: красная `main` замораживает очередь мержа (#1326, #1510) — и
# правильно делает: мержить поверх сломанной базы бессмысленно. Но у правила не
# было выхода из положения, когда база красная НЕ ПО ДЕЛУ. Круг замыкался так:
# новый прогон `main` рождается только новым мержем, мерж заморожен, а
# перезапустить прогон из облачной сессии нельзя — прокси закрывает запись, и
# GitHub отвечает «403 Resource not accessible by integration». Дважды подряд
# (08–09.09.2026) очередь стояла из-за ОДНОЙ мигнувшей ячейки матрицы, и сдвигал
# её клик человека.
#
# У workflow права есть — тот же приём, что в `rerun-flaky-checks.yml`.
#
# ЧТО ЭТОТ WORKFLOW НЕ ДЕЛАЕТ. Он не «чинит красноту». Соседний механизм
# страхуется закрытым списком имён; здесь риск снимается по другой оси, и обе
# половины обязательны: упала РОВНО ОДНА проверка (настоящая поломка валит ряд
# ячеек, сборку или линтер — мигание почти всегда одиночно) и это ПЕРВАЯ
# попытка. Не помогло — заморозка остаётся, и очередь двигает PR с меткой
# `blocker`, а не второй перезапуск.
#
# РЕКУРСИИ НЕТ. Перезапуск порождает новый прогон `main`, тот по завершении
# снова разбудит этот workflow — и получит отказ: `run_attempt` уже 2. Граница
# «одна попытка» держит цикл сама, отдельного стопора не нужно.
on:
  # Решать надо сразу по завершении прогона базы: каждый час простоя очереди —
  # это готовые PR, стоящие без причины.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # Подстраховка на случай пропущенного события и способ проверить механизм,
  # не дожидаясь следующего мержа.
  workflow_dispatch:
  schedule:
    # Минуты не круглые: в 0 и 30 GitHub обслуживает расписания всей планеты.
    - cron: "23 * * * *"

permissions:
  contents: read
  # Ради чего всё и затевалось: перезапуск упавших джобов — это запись.
  actions: write

concurrency:
  group: rerun-red-main
  cancel-in-progress: false

jobs:
  rerun:
    runs-on: ubuntu-latest
    # `workflow_run` приходит и от прогонов PR — у них `head_branch` это
    # head-ветка. Про чужую ветку механизму сказать нечего: замораживает
    # очередь только база.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.head_branch == 'main'
    # issue #1271: без этого действует умолчание GitHub в 6 часов.
    timeout-minutes: 10

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Скрипт — чистый stdlib поверх `scripts/gh_rest.py`, ставить нечего.
      #
      # СЛЕД ОБЯЗАТЕЛЕН, и потому итог уходит в summary прогона, а не только в
      # лог. «Прогон был красным и стал зелёным» без объяснения выглядит как
      # исчезнувшая улика: следующий разбор начнётся с вопроса, кто и почему
      # тронул базу. Здесь на него отвечено заранее — что перезапущено, что не
      # тронуто и на каком основании.
      - name: Красная база получает один перезапуск
        run: |
          {
            echo "## Перезапуск красной main"
            echo '```'
            python scripts/rerun_red_main.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
