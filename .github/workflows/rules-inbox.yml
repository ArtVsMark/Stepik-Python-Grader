# Канал с каталогом правил: входящие (issue #1384).
#
# Каталог `ArtVsMark/Engineering-Incidents-Playbook` хранит правила с инцидентами, а этот
# проект отвечает по каждому в `.rules/bindings.json`. Прогон ниже сверяет одно
# с другим и ведёт ОДНУ задачу-«входящие» со списком того, на что ответа ещё
# нет.
#
# Своего скрипта здесь нет намеренно: реализация одна и живёт у автора каталога,
# а копия генератора в каждом проекте — это N реализаций одного алгоритма, и
# первая же правка разведёт их. По той же причине отсюда удалён
# `scripts/rules_inbox.py`, делавший ровно это.
#
# Каталог не рассылает ничего сам: рассылка потребовала бы токена с правом
# писать во все проекты сразу. Тянет потребитель — своим `GITHUB_TOKEN` и в свой
# трекер.
name: rules-inbox

on:
  # Минута не круглая: в 0 и 30 площадка обслуживает расписания всей планеты.
  schedule:
    - cron: "17 6 * * *"
  # У событийной автоматики обязана быть ручная кнопка — иначе состояние,
  # в которое она попала, нечем поправить изнутри.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  inbox:
    # Без этого действует умолчание площадки в 6 часов: зависший шаг держал бы
    # не только себя.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Закреплено по SHA, а не по тегу и тем более не по ветке: тег переставим
      # кто угодно на той стороне, и «закрепиться» перестало бы что-либо значить.
      # Комментарий рядом называет версию, чтобы обновление читалось глазами.
      - uses: ArtVsMark/Engineering-Incidents-Playbook@ae8036feed0b7ca2679ff333aff07a42ee957314 # 1.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
