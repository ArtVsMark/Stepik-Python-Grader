name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile at_first.py stepik_client.py storage.py executor.py microbench_runner.py diagnostik_stepik.py test.py
          echo "✅ Синтаксических ошибок не найдено"

      - name: Ruff lint + format check
        uses: astral-sh/ruff-action@v3
        with:
          args: check .
