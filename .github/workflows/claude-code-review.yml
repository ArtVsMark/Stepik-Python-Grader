name: Claude Code Review

# issue #808 (ACT-04): триггер намеренно `pull_request`, а НЕ
# `pull_request_target`. На PR из форка `secrets.CLAUDE_CODE_OAUTH_TOKEN`
# недоступен, поэтому авто-ревью там не выполняется — это осознанное
# ограничение, а не поломка. «Очевидная починка» через `pull_request_target`
# катастрофична: он выполняется в контексте БАЗОВОЙ ветки и отдаёт секреты
# workflow, запущенному по коду постороннего автора. Форковый PR ревьюит
# мейнтейнер — вручную или упоминанием «@claude» в комментарии (claude.yml,
# где запуск ограничен доверенным author_association).
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# issue #1036 (REL-1-02): одно ревью на PR. Каждый пуш в ветку запускал новое, а
# предыдущее продолжало занимать слот и дописывать комментарии к уже
# переписанному диффу — при разводке конфликтов это несколько ревью одного и
# того же PR подряд.
concurrency:
  group: review-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # issue #1271: без этого действует умолчание GitHub в 6 часов —
    # зависший агент держит слот и очередь проверок на PR.
    timeout-minutes: 20
    # issue #808 (ACT-04): на форковых PR секрета нет — job не падал бы с
    # осмысленной ошибкой, а тихо ломался на шаге агента. Явный скип делает
    # ограничение видимым в списке проверок вместо «красного» шага без причины.
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1.0.210
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # issue #808 (ACT-03): сам action запинен по SHA выше, а вот
          # маркетплейс плагинов остаётся плавающим — `plugin_marketplaces`
          # принимает только git-URL, формата «URL на ревизии» в схеме action
          # (action.yml) нет. То есть код плагина `code-review` берётся из
          # ветки по умолчанию anthropics/claude-code на момент запуска.
          # Остаточный риск принят осознанно: маркетплейс — репозиторий того же
          # вендора, что и сам action, и права job'а read-only.
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # issue #1272: без этой строки ревью отказывалось работать на каждом
          # PR, где последнее событие пришло от агентского окна — «Workflow
          # initiated by non-human actor: claude (type: Bot)». Причина не в
          # авторстве PR (он создаётся от человека, и первый прогон проходит), а
          # в событии `synchronize`: его шлёт тот, кто толкнул в ветку, а
          # обновление ветки из `main` обязательно — в ruleset включено
          # «Require branches to be up to date». То есть красная проверка
          # получалась на каждом PR, и ревьюилось состояние ДО обновления.
          #
          # Список именной, а не `*`: разрешён ровно один бот — тот, чьи правки
          # и так подписаны сессией владельца. `*` пустил бы сюда любое
          # приложение с доступом к репозиторию. Периметр от этой строки не
          # расширяется: job остаётся read-only, форковые PR по-прежнему
          # пропускаются (условие `if` выше), а запуск по упоминанию
          # (`claude.yml`) сохраняет свой гейт по `author_association`.
          allowed_bots: 'claude'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
