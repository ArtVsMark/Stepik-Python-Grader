name: Задача Stepik не проверяется правильно / Stepik task is graded incorrectly
description: Скачанная задача не грейдится, тесты не находятся или вердикт расходится со Stepik / The downloaded task fails to grade, tests are not found, or the verdict differs from Stepik
title: "task: "
# issue #835 (GROW-04): у ЭТОЙ формы область известна заранее — расхождение
# вердикта со Stepik всегда упирается в разбор тест-кейсов или в загрузчик,
# поэтому метки навигации ставятся статически. У баг-репорта и идеи область
# заранее не известна, там форма её спрашивает (см. bug_report.yml).
labels: ["bug", "area/core", "downloader"]
# `id` полей — контракт для prefilled-URL (core/feedback.py). См. комментарий
# в bug_report.yml.
body:
  - type: markdown
    attributes:
      value: |
        Самый полезный для проекта тип обращения: расхождение локального
        вердикта со Stepik почти всегда означает баг в парсере тест-кейсов или
        в нормализации вывода.

        ⚠️ **Не вставляйте сюда своё решение целиком** — по правилам курсов это
        публикация ответа. Достаточно ссылки на шаг и того, чем отличается
        вывод. Если без кода не обойтись — минимальный фрагмент, воспроизводящий
        расхождение.

  - type: input
    id: step-url
    attributes:
      label: Ссылка на шаг Stepik / Stepik step URL
      description: URL шага, на котором расходится вердикт.
      placeholder: https://stepik.org/lesson/.../step/...
    validations:
      required: false

  - type: dropdown
    id: symptom
    attributes:
      label: Что именно происходит / What exactly happens
      options:
        - Локально зачёт, на Stepik — нет
        - Локально не зачёт, на Stepik — зачёт
        - Тест-кейсы не найдены / формат не определился
        - Задача не скачивается
        - Другое (опишу ниже)
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Подробности / Details
      description: Чем отличается ожидаемый вывод от полученного.
    validations:
      required: true

  - type: textarea
    id: task-context
    attributes:
      label: Контекст задачи / Task context
      description: |
        Заполняется автоматически, если открыть форму из грейдера: определённый
        формат тест-кейсов, число кейсов, вердикты. Без кода решения.
      render: text
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Окружение / Environment
      description: Заполняется автоматически, если открыть форму из грейдера.
      render: text
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Коммит / Commit (`git log --oneline -1`)
      description: |
        Заполняется автоматически, если грейдер запущен из git-клона. При установке
        через pip остаётся пустым — тогда точку истории показывает хеш внутри версии
        в «Окружении» (`1.9.0.postN+g<hash>`).
      placeholder: 7a9d8e1 Merge pull request #741 from ArtVsMark/docs/reliability-sweep-700
    validations:
      required: false
