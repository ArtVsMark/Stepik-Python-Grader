name: Tracker guardrails

# issue #1348: две проверки состояния трекера были написаны, покрыты тестами —
# и не запускались НИЧЕМ: ни `ci.yml`, ни `preflight.py`, ни pre-commit, ни
# расписанием. Свод при этом обещал, что они «проверяют», то есть правило
# исполнялось ровно тогда, когда кто-то вспомнит команду. За месяц не вспомнил
# никто.
#
# ПОЧЕМУ НЕ В `ci.yml`. Обе ходят в GitHub API, а квота общая на аккаунт и
# расходуется прогонами всех PR разом. Предмет у них — состояние ТРЕКЕРА, а не
# кода: от коммита к коммиту оно не меняется, поэтому проверять его на каждый
# push бессмысленно вдвойне — и дорого, и не о том.
#
# ПОЧЕМУ ПРЕДУПРЕЖДЕНИЕ, А НЕ ОТКАЗ. Проверки судят о вероятном: чек-лист мог
# отсутствовать намеренно, `good first issue` мог быть только что заведён и ещё
# ждать перевода. Красный прогон здесь означал бы «почини трекер», а чинить
# может быть нечего — поэтому итог не уходит в код возврата.
#
# КУДА ОН УХОДИТ (issue #1384, правило 142). В ЗАДАЧУ, а не в summary прогона:
# у проверки по расписанию обязан быть адресат, иначе она отличается от
# незапущенной только счётом за машинное время. Summary открывают руками и
# только зная, что там что-то есть, — то есть находки существовали для того,
# кто и так пошёл смотреть.
on:
  schedule:
    # Раз в сутки. Минута не круглая: в 0 и 30 GitHub обслуживает расписания
    # всей планеты, и запуск сдвигается непредсказуемо.
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Проверки трекер только читают; обратная ссылка правила — единственный шаг,
  # который в него ПИШЕТ (метка и один идемпотентный комментарий на задачу).
  issues: write
  pull-requests: read

concurrency:
  group: tracker-guardrails
  cancel-in-progress: false

jobs:
  tracker-state:
    runs-on: ubuntu-latest
    # issue #1271: без этого действует умолчание GitHub в 6 часов — зависший
    # шаг держал бы исполнителя, которым пользуются прогоны PR.
    timeout-minutes: 10

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Обе проверки — чистый stdlib поверх `scripts/gh_rest.py` (REST, 1 запрос
      # из 5000 вместо ~300 points за GraphQL-операцию), ставить нечего.
      #
      # `|| true` и запись в summary вместо `continue-on-error`: последний
      # красит шаг в жёлтое и прячет причину под кат, а нам нужно, чтобы итог
      # читался с первого экрана прогона — иначе предупреждение снова окажется
      # тем, о чём никто не вспомнит.
      - name: Клонировать каталог правил
        timeout-minutes: 5
        run: git clone --depth 1 https://github.com/ArtVsMark/Engineering-Incidents-Playbook /tmp/playbook

      # issue #1351: связь «задача → правило» была односторонней — у правила след
      # ведёт на задачу, у задачи о правиле ни слова, и следующий разбор того же
      # места начинается с нуля. Комментарий ОДИН на задачу и обновляется по
      # месту: идемпотентность держится скрытым маркером в теле, а не совпадением
      # текста (текст растёт вместе с числом правил).
      #
      # Единственный шаг файла, которому нужна запись в трекер. Клон каталога
      # сделан шагом выше.
      - name: Задача знает, что породила правило
        run: |
          {
            echo "## Обратная ссылка в задачу-источник"
            echo '```'
            python scripts/link_rules_to_issues.py --catalogue /tmp/playbook --apply 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # issue #1384 (правило 142): у находок ночного обхода появился АДРЕСАТ.
      # Раньше шесть проверок писали их в summary прогона — то есть туда, куда
      # идут, уже зная, что там что-то есть; прогон при этом всегда зеленел.
      # Теперь `nightly_checks.py` ведёт ОДНУ задачу: пока находки есть, она
      # открыта и обновляется, стало чисто — закрывается со словами об этом.
      #
      # Сами проверки перечислены в скрипте, а не шагами здесь: шаги workflow
      # не тестируются, а список в скрипте — да (tests/test_nightly_checks.py).
      - name: Ночной обход — находки получают адресата
        run: |
          {
            echo "## Ночной обход"
            echo '```'
            python scripts/nightly_checks.py --catalogue /tmp/playbook --apply 2>&1
            echo '```'
            echo "Находки живут в задаче с меткой «ночной обход», а не в этой сводке."
          } >> "$GITHUB_STEP_SUMMARY"
