name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # issue #173 / эпик #167: README-витрина не должна разрастаться, а локальные
  # Markdown-ссылки README ↔ docs не должны протухать. Проверка на чистом stdlib
  # (без pip install) — быстрая и детерминированная, поэтому отдельным job.
  docs-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: README line-budget + Markdown link-check
        run: python scripts/check_docs_guardrails.py
      # issue #264: message_id-каталог веб-API (web/i18n.py) — ru.json должен
      # покрывать все message_id, используемые в web/*.py, а ru.json/en.json
      # обязаны иметь одинаковый набор ключей. Тоже чистый stdlib (ast/json),
      # без pip install — держим в том же быстром job, что и docs-guardrails.
      - name: Locale message catalog guardrails (issue #264)
        run: python scripts/check_locale_guardrails.py

  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    # issue: coverage- и version-бейджи README читают .github/badges/*.json —
    # только один job матрицы (ubuntu-latest/3.12, push в main) коммитит их обратно.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
        experimental: [false]
        include:
          - os: ubuntu-latest
            python-version: "3.14"
            experimental: true

    steps:
      - uses: actions/checkout@v5
        # issue #162: динамическая версия (setuptools-scm) вычисляется из git-тегов.
        # fetch-depth: 0 подтягивает полную историю + теги, иначе pip install -e .
        # не сможет определить версию, а check_version_consistency.py — baseline.
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check
        run: mypy src/stepik_grader --ignore-missing-imports

      - name: Version consistency (issue #165)
        run: python scripts/check_version_consistency.py

      - name: Run tests
        run: pytest -q

      # Один job матрицы (ubuntu-latest/3.12, не experimental) на push в main
      # пересчитывает README-бейджи (coverage из свежего coverage.xml, текущая
      # логическая версия из scripts/version.py) и коммитит их одним коммитом —
      # без этого шага README хранил бы вручную вписанные числа, которые
      # расходятся с реальностью при каждом изменении тестов/коммите.
      #
      # Ретрай (до 3 попыток): два push в main с разницей меньше времени
      # прогона CI запускают этот шаг дважды параллельно — второй из них видит
      # чужой уже запушенный бейдж-коммит и падает на `git pull --rebase`
      # конфликтом в .github/badges/*.json (само по себе безобидно: конфликт
      # ловится ДО push, main не портится, но job краснеет). При конфликте —
      # abort rebase, сброс на свежий origin/main и пересчёт бейджей заново
      # (после сброса они обычно уже совпадают с тем, что запушил конкурент,
      # и шаг мирно завершается на "Badges unchanged"). Итоговая неудача после
      # 3 попыток — не fatal (::warning::, не ::error::): бейджи досчитает
      # следующий push, а не быть источником ложно-красного CI из-за гонки.
      - name: Update badges (main only)
        if: |
          github.event_name == 'push' &&
          matrix.os == 'ubuntu-latest' &&
          matrix.python-version == '3.12' &&
          matrix.experimental == false
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            python scripts/generate_coverage_badge.py
            python scripts/generate_version_badge.py
            if git diff --quiet -- .github/badges/; then
              echo "Badges unchanged."
              break
            fi
            git add .github/badges/
            git commit -m "chore(ci): update badges [skip ci]"
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Badges pushed (attempt $attempt)."
              break
            fi
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/main
            if [ "$attempt" = 3 ]; then
              echo "::warning::Badge update push raced with a concurrent update and failed after 3 attempts — a later push will catch it up."
            else
              echo "Attempt $attempt: badge push raced with a concurrent update — retrying."
              sleep $((attempt * 5))
            fi
          done

  # issue #263: Playwright e2e smoke tests for the web UI (--serve) -- 4 user
  # journeys (mode 2 folder grading, mode 1 file picker + editable window,
  # glossary search, command palette) plus an XSS regression test for app.js's
  # esc() escaping. Deliberately a SEPARATE job, not folded into the `test`
  # matrix above: Linux-only (one browser/OS combo is enough for a DOM-level
  # smoke suite), and tests/e2e/ needs the opt-in "e2e" extra + a downloaded
  # Chromium binary that the main matrix jobs must not pay for. Playwright
  # itself is a dev-only extra (see pyproject.toml's `e2e` group) -- it is
  # NOT a new runtime dependency.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # issue #162: setuptools-scm needs full history + tags to resolve
        # the package version during `pip install -e .` (same reasoning as
        # the `test` job above).
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies (dev + e2e extras)
        run: pip install -e ".[dev,e2e]"

      # Cache Chromium's downloaded binary (~100+ MB) across runs, keyed on
      # OS + pyproject.toml's content hash so a playwright version bump
      # invalidates the cache automatically.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install Playwright Chromium + OS deps (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      # Cache hit: the browser binary is already there, but the runner image
      # itself is ephemeral -- Chromium's shared-library OS deps still need
      # (re-)installing every run.
      - name: Install Playwright OS deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run e2e tests
        run: pytest tests/e2e/ -v --no-cov
