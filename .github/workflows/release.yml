name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

# PyPI publish is intentionally NOT included here (issue #51 C-03): it needs
# a trusted-publisher relationship configured on pypi.org for this project
# first (Settings -> Publishing on the PyPI project page), which requires
# manual, one-time setup by a repo owner with PyPI access. Once that exists,
# add a step here using pypa/gh-action-pypi-publish@release/v1 with
# permissions: id-token: write (OIDC trusted publishing, no stored secret).
